name: Abtin CI / Security

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DJANGO_SETTINGS_MODULE: config.settings.dev
  PYTHONUNBUFFERED: '1'
  SEED_DEFAULT_PASSWORD: ci-only-StrongPassword-2026!

jobs:
  backend:
    name: Backend tests and Django checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Django system checks
        run: python manage.py check

      - name: Migration consistency
        run: python manage.py makemigrations --check --dry-run

      - name: Phase smoke tests
        run: |
          python smoke_phase4.py
          python smoke_phase5.py
          python smoke_phase6.py
          python smoke_phase6_complete.py
          python smoke_phase7.py

      - name: Security regression tests
        run: python security_smoke.py

  python-security:
    name: Python dependency and static security audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies and scanners
        run: |
          python -m pip install -r requirements.txt
          python -m pip install bandit pip-audit

      - name: Bandit
        run: bandit -r apps config -lll -iii

      - name: pip-audit
        run: pip-audit -r requirements.txt

      - name: Production Django security checks
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_SECRET_KEY: ci-only-not-for-production-${{ github.run_id }}-replace-me
          ALLOWED_HOSTS: example.com
          CORS_ALLOWED_ORIGINS: https://app.example.com
          CSRF_TRUSTED_ORIGINS: https://app.example.com
        run: python manage.py check --deploy

  frontend:
    name: Frontend audit and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high

      - name: Production build
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: abtin-frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7
