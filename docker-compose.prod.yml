# Production: فقط Caddy (۸۰/۴۴۳) به بیرون باز است؛ app و db فقط در شبکه‌ی داخلی.
# اجرا:  cp .env.production.example .env && sh scripts/gen-secrets.sh >> .env  (سپس DOMAIN را ویرایش کنید)
#        docker compose -f docker-compose.prod.yml up -d --build
name: abtin
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: abtin_distribution
      POSTGRES_USER: abtin
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U abtin -d abtin_distribution"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://abtin:${DB_PASSWORD}@db:5432/abtin_distribution
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      TRUST_PROXY: "1"
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-600}
      RATE_LIMIT_LOGIN_PER_MIN: ${RATE_LIMIT_LOGIN_PER_MIN:-30}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-1}
    volumes: [uploads:/srv/app/uploads]
    networks: [internal, edge]   # edge فقط برای خروجی (وبهوک/ایمیل/پیامک)؛ پورتی publish نمی‌شود
    expose: ["8000"]
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80","443:443"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal, edge]
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      PGHOST: db
      PGUSER: abtin
      PGDATABASE: abtin_distribution
      PGPASSWORD: ${DB_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-0}
    volumes:
      - ./scripts:/scripts:ro
      - backups:/backups
    command: ["sh","/scripts/backup-loop.sh"]
    networks: [internal]
networks:
  internal: { internal: true }
  edge: {}
volumes: { pgdata: {}, uploads: {}, backups: {}, caddy_data: {}, caddy_config: {} }
