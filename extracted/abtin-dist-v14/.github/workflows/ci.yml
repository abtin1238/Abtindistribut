name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: mypy (core/services؛ فعلاً غیرمسدودکننده تا خطاهای اولیه رفع شود)
        run: mypy
        continue-on-error: true
      - name: pytest (هر فایل در پروسهٔ جدا — engine/DB هنگام import ساخته می‌شود) + coverage جمع‌شده؛ هدف ≥۸۰٪
        env: { COV: '1', ADMIN_PASSWORD: test-password }
        run: bash scripts/run_tests.sh
      - name: alembic upgrade on empty SQLite
        env: { DATABASE_URL: 'sqlite:////tmp/ci_alembic.sqlite3', ADMIN_PASSWORD: ci-password }
        run: rm -f /tmp/ci_alembic.sqlite3 && alembic upgrade head && alembic current
  postgres:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env: { POSTGRES_DB: abtin, POSTGRES_USER: abtin, POSTGRES_PASSWORD: ci-pg-password }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U abtin -d abtin" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://abtin:ci-pg-password@127.0.0.1:5432/abtin
      ADMIN_PASSWORD: ci-password-long-enough
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r requirements-dev.txt
      - name: alembic upgrade on empty PostgreSQL
        run: alembic upgrade head && alembic current
      - name: backup + restore smoke test
        env: { PGHOST: 127.0.0.1, PGUSER: abtin, PGPASSWORD: ci-pg-password, PGDATABASE: abtin }
        run: |
          mkdir -p /tmp/backups && pg_dump --format=custom --no-owner --file=/tmp/backups/abtin_ci.dump
          sh scripts/restore-test.sh /tmp/backups/abtin_ci.dump
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pip-audit && pip-audit -r requirements.txt
      - name: JS syntax check
        run: for f in web/js/*.js web/js/shared/*.js mobile/js/*.js; do node --check "$f"; done
      - name: shell scripts syntax
        run: for f in scripts/*.sh run.sh; do sh -n "$f"; done
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install pytest playwright && playwright install --with-deps chromium
      - name: UI tests (mock API, desktop + mobile 390px)
        run: pytest -q tests/ui
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package.json }
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
