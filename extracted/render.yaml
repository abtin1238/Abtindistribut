services:
  - type: web
    name: abtin-distribution
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: abtin-distribution-db
          property: connectionString
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: API_DOCS_ENABLED
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"

databases:
  - name: abtin-distribution-db
    plan: free
    databaseName: abtin_distribution
    user: abtin
