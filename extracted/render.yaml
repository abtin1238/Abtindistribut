services:
  - type: web
    name: abtin-distribution
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DATABASE_URL
        fromDatabase:
          name: abtin-distribution-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: abtin-distribution-redis
          type: keyvalue
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: abtin-distribution-redis
          type: keyvalue
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: SEED_DEFAULT_PASSWORD
        value: Demo-Strong-Password-2026!

  - type: keyvalue
    name: abtin-distribution-redis
    plan: free
    region: frankfurt
    maxmemoryPolicy: noeviction
    ipAllowList:
      - source: 0.0.0.0/0
        description: public

databases:
  - name: abtin-distribution-db
    plan: free
    region: frankfurt
    postgresMajorVersion: '16'
    diskSizeGB: 1
